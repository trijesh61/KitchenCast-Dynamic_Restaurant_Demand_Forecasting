stages:

  data_ingestion:
    cmd: python -m src.components.data_ingestion
    deps:
      - src/components/data_ingestion.py
      - config/config.yaml
      - data/raw/train.csv
    outs:
      - artifacts/data_ingestion/raw.csv
      - artifacts/data_ingestion/train.csv
      - artifacts/data_ingestion/test.csv


  data_validation:
    cmd: python -m src.components.data_validation
    deps:
      - src/components/data_validation.py
      - config/config.yaml
      - config/schema.yaml
      - artifacts/data_ingestion/train.csv
    outs:
      - artifacts/data_validation/status.txt


  data_transformation:
    cmd: python -m src.components.data_transformation
    deps:
      - src/components/data_transformation.py
      - config/config.yaml
      - data/raw/meal_info.csv
      - data/raw/fulfilment_center_info.csv
      - artifacts/data_ingestion/train.csv
      - artifacts/data_ingestion/test.csv
    outs:
      - artifacts/data_transformation/X_train.npz
      - artifacts/data_transformation/X_test.npz
      - artifacts/data_transformation/y_train.npy
      - artifacts/data_transformation/y_test.npy
      - artifacts/data_transformation/preprocessor.pkl


  model_training:
    cmd: python -m src.components.model_trainer
    deps:
      - src/components/model_trainer.py
      - config/config.yaml
      - artifacts/data_transformation/X_train.npz
      - artifacts/data_transformation/y_train.npy
    outs:
      - artifacts/model_trainer/model.pkl


  model_evaluation:
    cmd: python -m src.components.model_evaluation
    deps:
      - src/components/model_evaluation.py
      - config/config.yaml
      - artifacts/model_trainer/model.pkl
      - artifacts/data_transformation/X_test.npz
      - artifacts/data_transformation/y_test.npy
    metrics:
      - artifacts/model_evaluation/metrics.json